#
# upstream.conf — pinned upstream software versions, checksums and signing keys.
#
# This is the SINGLE source of truth for upstream version pins used by
# lib/openvpn_install.sh and lib/pki.sh. Do not hardcode versions elsewhere.
#
# Last verified: 2026-09-22 against official upstream sources:
#   - https://community.openvpn.net/openvpn/wiki/ReleaseHistory
#   - https://swupdate.openvpn.net/community/releases/
#   - https://github.com/OpenVPN/easy-rsa/releases
#   - https://build.openvpn.net/debian/openvpn/stable/dists/
#

# --- OpenVPN Community Edition -----------------------------------------
OPENVPN_VERSION="2.7.7"
OPENVPN_SOURCE_URL="https://swupdate.openvpn.net/community/releases/openvpn-${OPENVPN_VERSION}.tar.gz"
OPENVPN_SOURCE_SIG_URL="https://swupdate.openvpn.net/community/releases/openvpn-${OPENVPN_VERSION}.tar.gz.asc"
OPENVPN_SOURCE_SHA256="3ab8f48fd6c26d49ba2333a092433949afdb5c85c0e6a1ff265784fbc04a2463"
# OpenVPN Inc "Security Mailing List" release-signing master key.
# The tarball is signed by a rotating [S] subkey of this master key; we
# verify against the master key fingerprint and require a valid binding.
OPENVPN_GPG_FINGERPRINT="F554A3687412CFFEBDEFE0A312F5F7B42F2B01E7"
OPENVPN_GPG_KEY_URL="https://keys.openpgp.org/vks/v1/by-fingerprint/F554A3687412CFFEBDEFE0A312F5F7B42F2B01E7"

# Official OpenVPN community apt repository (build.openvpn.net). Used when
# the target Ubuntu codename has an official current 2.7.x package, which
# as of the date above is true for: jammy, noble, resolute (and newer).
# Older LTS releases (bionic, focal) only carry 2.6.x there and fall back
# to a verified source build instead.
OPENVPN_APT_REPO_BASE="https://build.openvpn.net/debian/openvpn/stable"
OPENVPN_APT_KEY_URL="https://swupdate.openvpn.net/repos/repo-public.gpg"
OPENVPN_APT_KEY_FINGERPRINT="30EBF4E73CCE63EEE124DD278E6DA8B4E158C569"
# Ubuntu codenames confirmed (2026-09-22) to carry OpenVPN 2.7.7 in the
# official apt repo above. Anything else falls back to a source build.
OPENVPN_APT_SUPPORTED_CODENAMES="jammy noble resolute"

# --- Easy-RSA (PKI) ------------------------------------------------------
EASYRSA_VERSION="3.2.7"
EASYRSA_SOURCE_URL="https://github.com/OpenVPN/easy-rsa/releases/download/v${EASYRSA_VERSION}/EasyRSA-${EASYRSA_VERSION}.tgz"
EASYRSA_SOURCE_SIG_URL="https://github.com/OpenVPN/easy-rsa/releases/download/v${EASYRSA_VERSION}/EasyRSA-${EASYRSA_VERSION}.tgz.sig"
EASYRSA_SOURCE_SHA256="308743bc9fe871b902d47dbe98d749daff3a05b27531684f02625ce7208d4598"
# Easy-RSA release-signing key (Eric F Crist, OpenVPN/easy-rsa maintainer).
EASYRSA_GPG_FINGERPRINT="6F4056821152F03B6B24F2FCF8489F839D7367F3"
EASYRSA_GPG_KEY_URL="https://keys.openpgp.org/vks/v1/by-fingerprint/6F4056821152F03B6B24F2FCF8489F839D7367F3"

