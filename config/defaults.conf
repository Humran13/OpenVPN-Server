#
# defaults.conf — default values used by the installer and manager when the
# administrator does not override them. These are safe, modern defaults.
#

# Filesystem layout
DEFAULT_OPT_DIR="/opt/openvpn-server-manager"
DEFAULT_ETC_DIR="/etc/openvpn-server-manager"
DEFAULT_VAR_DIR="/var/lib/openvpn-server-manager"
DEFAULT_LOG_DIR="/var/log/openvpn-server-manager"
DEFAULT_OPENVPN_ETC_DIR="/etc/openvpn"
DEFAULT_CLIENT_EXPORT_DIR="/root/openvpn-clients"
DEFAULT_PKI_DIR="/etc/openvpn-server-manager/pki"

# Networking
# Per-listener VPN subnets are NOT static defaults — they're computed
# dynamically per listener index by srvcfg_subnet_for_index()/
# srvcfg_subnet6_for_index() in lib/server_config.sh (starting at
# 10.8.0.0/24 and fd00:cafe:8::/64), specifically so multiple listeners
# never collide. See docs/DESIGN-DECISIONS.md.
DEFAULT_UDP_PORT=1194
DEFAULT_TCP_PORT=443

# Crypto
DEFAULT_DATA_CIPHERS="AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305"
DEFAULT_FALLBACK_CIPHER="AES-256-GCM"
DEFAULT_AUTH_DIGEST="SHA256"
DEFAULT_TLS_VERSION_MIN="1.2"
DEFAULT_EASYRSA_ALGO="ec"
DEFAULT_EASYRSA_CURVE="secp384r1"
DEFAULT_EASYRSA_DIGEST="sha256"
DEFAULT_CERT_EXPIRE_DAYS=825
DEFAULT_CA_EXPIRE_DAYS=3650
DEFAULT_CRL_DAYS=180

# DNS preset resolver IPs are defined directly in
# lib/server_config.sh:_srvcfg_dns_lines() (cloudflare/google/quad9); this
# is just the list of valid --dns values, checked by validate.sh.

# Ubuntu support matrix. Support itself is version-based (see
# os_is_supported() in lib/os.sh, MIN_SUPPORTED_UBUNTU_VERSION below); this
# list only drives the "not part of the explicitly tested matrix" warning.
TESTED_UBUNTU_CODENAMES="bionic focal jammy noble resolute"
MIN_SUPPORTED_UBUNTU_VERSION="18.04"
